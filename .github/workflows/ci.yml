name: CI

on: push

env:
  CARGO_TERM_COLOR: always
  DENO_DIR: .deno-cache
  RUST_BACKTRACE: 1

jobs:
  code-style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.8
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --bins --tests
      - run: pip install mypy
      - run: mypy apis/python/razel.py

  tests:
    name: Test ${{ matrix.os }} ${{matrix.target}}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{matrix.target}}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc
          fallback: none

      - name: cache deno
        uses: actions/cache@v6
        with:
          path: .deno-cache/deps
          key: ${{ runner.os }}-deno-${{ hashFiles('apis/deno/razel.ts', 'examples/deno.ts') }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cmake --version
      - run: deno info
      - run: deno --version
      - run: protoc --version

      - run: rustup show
      - run: rustup target add ${{matrix.target}}
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup run stable rustc --version

      - run: cargo check --locked
      - run: cargo check --locked -p razel --no-default-features
      - run: cargo check --locked -p razel-server --lib --target=wasm32-unknown-unknown --no-default-features -F hydrate
      - run: cargo check --locked -p razel-server --no-default-features -F ssr

      - run: cargo run --locked -- exec --info -f examples/razel.jsonl

      - run: cargo test --locked --no-fail-fast -- --nocapture --skip real_time_test --skip grpc_server

      # install binary, to be used by following API tests
      - run: cargo install --force --locked --path razel

      # test local version of Deno API
      - run: deno run -A --check examples/deno.ts
      - run: git diff --exit-code examples/razel.jsonl

      # test local version of Python API
      - name: Set up python3.8
        uses: actions/setup-python@v7
        with:
          python-version: 3.8
      - run: python3 examples/python.py
        env:
          PYTHONPATH: apis/python
      - run: git diff --exit-code examples/razel.jsonl

      - uses: actions/upload-artifact@v7
        with:
          name: razel-${{github.ref_name}}-${{matrix.target}}
          path: |
            target/${{matrix.target}}/release/razel
            target/${{matrix.target}}/release/razel.exe
          if-no-files-found: error
          retention-days: 1
