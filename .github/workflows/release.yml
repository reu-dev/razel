name: Create Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        default: 'patch'
        type: choice
        options:
          - prepatch
          - patch
          - preminor
          - minor
          # - premajor
          # - major
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bump-version-and-create-tag:
    name: Bump ${{github.event.inputs.releaseType}} version
    outputs:
      VERSION: ${{steps.bump-version.outputs.VERSION}}
      TAG: ${{steps.bump-version.outputs.TAG}}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Configure git
        run: |
          git config user.email "${{github.actor}}@users.noreply.github.com"
          git config user.name "${{github.actor}}"
      - run: echo $GITHUB_OUTPUT
      - run: cat $GITHUB_OUTPUT
      - run: |
          .github/workflows/bump-version-and-create-tag.ts ${{github.event.inputs.releaseType}} $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
        id: bump-version
      - run: echo ${{steps.bump-version.outputs.TAG}}

  build:
    name: build ${{matrix.target}}
    needs: [ bump-version-and-create-tag ]
    runs-on: ${{matrix.os}}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - run: echo ${{needs.bump-version-and-create-tag.outputs.TAG}}
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: refs/tags/${{needs.bump-version-and-create-tag.outputs.TAG}}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup show
      - run: rustup target add ${{matrix.target}}
      - run: cargo build --release --target ${{matrix.target}} --bin razel
      - uses: actions/upload-artifact@v7
        with:
          name: razel-${{matrix.target}}
          path: |
            target/${{matrix.target}}/release/razel
            target/${{matrix.target}}/release/razel.exe
          if-no-files-found: error
          retention-days: 3

  publish-github:
    needs:
      - bump-version-and-create-tag
      - build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
      - run: ls -al
      - run: ls -al razel-*/
      - name: Zip binaries
        run: |
          for dir in $(ls -d razel-*); do
            gzip --stdout --keep $dir/* > $dir.gz
            zip -j $dir.zip $dir/*
          done
        shell: bash
      - run: ls -al
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          tag_name: ${{needs.bump-version-and-create-tag.outputs.TAG}}
          files: |
            razel-*.gz
            razel-*.zip

  publish-crates_io:
    needs:
      - bump-version-and-create-tag
      - publish-github
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{needs.bump-version-and-create-tag.outputs.TAG}}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc
          fallback: none
      - run: cargo publish --package razel
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}

  publish-pypi:
    needs:
      - bump-version-and-create-tag
      - publish-github
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{needs.bump-version-and-create-tag.outputs.TAG}}
      - run: .dist/publish-pypi.sh ${{needs.bump-version-and-create-tag.outputs.VERSION}}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{secrets.PYPI_TOKEN}}
